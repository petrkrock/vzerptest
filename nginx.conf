server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Gzip static assets
    gzip on;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;

    # Long-term caching for hashed build assets.
    # В Docker-варианте Nginx и так отдаёт статику напрямую (sendfile) —
    # Node-мост не участвует, скорость максимальная. В прокси-варианте
    # (VPS + monitor-server.js) аналогичный блок есть в README.SERVER.md.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # ОПЦИОНАЛЬНО: раздел «Сервер» в CRM (мониторинг VPS).
    # В Docker-контейнере мост не запущен — /api/* упадёт в SPA fallback,
    # и раздел покажет подсказку (это нормально). Если хотите мониторинг
    # рядом с Docker-версией — запустите monitor-server.js отдельным
    # процессом и раскомментируйте блок ниже:
    # location /api/ {
    #     proxy_pass http://127.0.0.1:3000;
    #     proxy_set_header Host $host;
    # }

    # SPA fallback — React Router handles routing client-side, so any
    # unknown path must still return index.html (not a 404).
    add_header X-Robots-Tag "noindex, nofollow, noarchive" always;

    location / {
        try_files $uri $uri/ /index.html;
    }

    # Never cache the HTML entry point itself, so deploys are picked up
    # immediately instead of being served from a stale cached index.html.
    location = /index.html {
        add_header Cache-Control "no-cache, no-store, must-revalidate";
    }

    # PWA: the service worker file itself must never be cached — browsers
    # already re-check it on every load, but a stale cached copy behind a
    # proxy would delay every future deploy from ever reaching users.
    location = /sw.js {
        add_header Cache-Control "no-cache, no-store, must-revalidate";
        add_header Service-Worker-Allowed "/";
    }

    # Correct MIME type for the web app manifest (some nginx builds don't
    # ship this mapping out of the box, and a wrong type makes Chrome/
    # Android silently refuse to treat the app as installable).
    location = /manifest.webmanifest {
        default_type application/manifest+json;
        add_header Cache-Control "no-cache, no-store, must-revalidate";
    }

    # Basic security headers
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # ПУБЛИЧНЫЕ СТРАНИЦЫ (/forms/* — встраиваемые формы, /s/* — самообслуживание
    # поставщика): разрешено встраивание на ЛЮБЫЕ внешние сайты.
    # Заголовки location в nginx НЕ наследуются с уровня server, если в
    # location есть свои add_header — поэтому X-Frame-Options здесь не
    # повторяем, а фрейминг разрешаем через CSP frame-ancestors *.
    # Без этого блока браузер блокирует iframe на чужих сайтах.
    location ~ ^/(forms|s|embed\.js) {
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Content-Security-Policy "frame-ancestors *" always;
        add_header X-Robots-Tag "noindex, nofollow, noarchive" always;
        add_header Cache-Control "no-cache, no-store, must-revalidate";
        try_files $uri $uri/ /index.html;
    }
}
